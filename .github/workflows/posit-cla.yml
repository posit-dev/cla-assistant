name: "CLA Assistant"
on:
  workflow_call:
    secrets:
      CLA_ASSISTANT_PAT:
        required: true

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: "Strip whitespace from comment body"
        id: strip_whitespace
        # The comment body is passed via an environment variable (COMMENT_BODY) to avoid
        # direct interpolation into the shell script, which could allow command injection
        # if the input is not properly handled. Using printf with the environment variable
        # ensures the content is treated as literal data.
        #
        # We require the comment body to be exactly one line containing the CLA consent sentence
        # (or recheck) as other parts of the message might contradict it. However, it's extremely
        # easy to accidentally include a trailing newline or two, which GitHub won't even show in
        # its rendering of the comment. The result is nothing happening, despite the comment
        # looking completely correct. So go out of our way to strip the newlines, and any leading
        # or trailing whitespace.
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf 'body=%s\n' "$COMMENT_BODY" |
            sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' |
            head -n 1 >> $GITHUB_OUTPUT
      # - name: "Debug output"
      #   run: |
      #     echo "body:'${{ steps.strip_whitespace.outputs.body }}'"
      - name: "CLA Assistant"
        if: (steps.strip_whitespace.outputs.body == 'recheck' || steps.strip_whitespace.outputs.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: posit-dev/cla-assistant-github-action@v2.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the below token should have repo scope and must be manually added by you in the repository's secret
          # This token is required only if you have configured to store the signatures in a remote repository/organization
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          # Specify that our signatures are kept in posit-dev/cla-assistant-signatures@main
          remote-organization-name: posit-dev
          remote-repository-name: cla-assistant-signatures
          branch: "main"
          path-to-signatures: "signatures/version1/cla.json"
          custom-notsigned-prcomment: >
            Thank $you for this PR! We ask that you sign our
            [Contributor License Agreement](https://posit.co/individual-contributor-agreement/)
            before we accept your contribution. You can sign the CLA by posting
            a comment on this PR saying:

          # This allowlist is seeded with most of the members of the Positron
          # repository. In the future, we may do something smarter here, such
          # as plumbing an allow list through as a parameter, or reading it
          # from another source instead of hardcoding it.
          allowlist: DavisVaughan, dependabot[bot], dfalbel, isabelizimm, jonvanausdeln, lionel-, nstrayer, petetronic, positron-bot[bot], seeM, sharon-wang, softwarenerd, timtmok, wesm, Copilot

          # the followings are the optional inputs - If the optional inputs are not given, then default values will be taken
          #remote-organization-name: enter the remote organization name where the signatures should be stored (Default is storing the signatures in the same repository)
          #remote-repository-name: enter the  remote repository name where the signatures should be stored (Default is storing the signatures in the same repository)
          #create-file-commit-message: 'For example: Creating file for storing CLA Signatures'
          #signed-commit-message: 'For example: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
          #custom-notsigned-prcomment: 'pull request comment with Introductory message to ask new contributors to sign'
          #custom-pr-sign-comment: 'The signature to be committed in order to sign the CLA'
          #custom-allsigned-prcomment: 'pull request comment when all contributors has signed, defaults to **CLA Assistant Lite bot** All Contributors have signed the CLA.'
          #lock-pullrequest-aftermerge: false - if you don't want this bot to automatically lock the pull request after merging (default - true)
          #use-dco-flag: true - If you are using DCO instead of CLA
